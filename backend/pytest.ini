[pytest]
# Phase 5D (P0-4) / KI-017: root pytest configuration so pytest-asyncio is
# actively engaged (asyncio_mode=auto) for the whole backend suite.
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: end-to-end tests requiring live services
    e2e_unit: offline end-to-end style unit tests
    slow: long-running tests
filterwarnings =
    ignore::DeprecationWarning
